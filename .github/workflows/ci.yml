name: T12 checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: >-
          python -m py_compile
          device/refresh.py
          device/apply_numbers.py
          device/build_site.py
          device/check_repeat.py
          device/validate_release.py
          device/test_device.py
          release/build_release.py

      - name: Run unit tests
        run: python -m unittest device/test_device.py -v

      - name: Check deterministic output
        run: python device/check_repeat.py

      - name: Build and validate draft site
        run: |
          python device/build_site.py --draft --output device/tmp/index.html
          python device/validate_release.py --allow-draft
